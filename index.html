<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEAR The Vibe - Thrift Store</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:#111;color:#fff;padding:20px;text-align:center}
.header h1{margin:0;font-size:28px;letter-spacing:2px}
.header p{color:#ffcc00;margin:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0002}
.card img{width:100%;height:180px;object-fit:cover}
.card div{padding:10px}
.price{color:green;font-weight:bold}
button{background:#111;color:#fff;border:none;padding:10px;width:100%;border-radius:8px;margin-top:5px}
.cart{position:fixed;bottom:0;left:0;right:0;background:#ffcc00;padding:12px;text-align:center;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1>WEAR The Vibe</h1>
<p>Thrift Store • Barpeta • Best Price</p>
<p>Shirt | Jacket | Jeans | Shoes</p>
</div>

<div class="grid" id="products"></div>
<div class="cart" onclick="order()">🛒 Cart (<span id="count">0</span>) - WhatsApp pe Order Karo</div>

<script>
let items=[
{name:"Vintage Denim Jacket",price:499,img:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500"},
{name:"Oversized Thrift Shirt",price:299,img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500"},
{name:"Baggy Jeans",price:399,img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=500"},
{name:"Thrift Hoodie",price:349,img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500"},
];
let cart=[];
let html="";
items.forEach((p,i)=>{
html+=`<div class="card"><img src="${p.img}"><div><b>${p.name}</b><br><span class="price">₹${p.price}</span><br><small>Size: M / L • Condition: 9/10</small><button onclick="add(${i})">Add to Cart</button></div></div>`
});
document.getElementById("products").innerHTML=html;
function add(i){cart.push(items[i]);document.getElementById("count").innerText=cart.length;alert(items[i].name+" added!")}
function order(){
if(cart.length==0){alert("Pehle kuch add karo bhai!");return}
let msg="Hi WEAR The Vibe! Mujhe ye chahiye:\n";
cart.forEach(p=>msg+=`- ${p.name} ₹${p.price}\n`);
window.open("https://wa.me/919706647667?text="+encodeURIComponent(msg));
}
</script>
</body>
</html>
